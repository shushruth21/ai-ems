openapi: 3.1.0
info:
  title: AI EMS API
  version: 0.2.0
  description: |
    Public HTTP API. Business endpoints (`/api/v1/*`, API-key auth) arrive
    with the Platform phase. Browser flows use server actions, not this API.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Liveness / readiness probe
      parameters:
        - name: deep
          in: query
          description: Set to `1` to also check the database.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/callback:
    get:
      summary: OAuth / PKCE callback (exchanges the code for a session)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: next, in: query, schema: { type: string } }
      responses:
        "307": { description: Redirect to `next` (same-origin only) or to sign-in with an error }
  /auth/confirm:
    get:
      summary: Email link verification (sign-up, magic link, recovery, email change)
      parameters:
        - { name: token_hash, in: query, required: true, schema: { type: string } }
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [signup, magiclink, recovery, email_change, invite, email] }
        - { name: next, in: query, schema: { type: string } }
      responses:
        "307": { description: Redirect after verification }
components:
  schemas:
    Health:
      type: object
      required: [status, service, version, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        version: { type: string }
        time: { type: string, format: date-time }
        database: { type: string, enum: [ok, unreachable] }
