<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f6f7f9;
      font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
      color: #1b1d23;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #e3e5ea;
      "
    >
      <tr>
        <td style="padding: 28px">
          <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px">AI EMS</p>
          <h1 style="margin: 0 0 12px; font-size: 20px">Confirm your email</h1>
          <p style="margin: 0 0 20px; line-height: 1.5">
            Confirm this address to finish creating your AI EMS account.
          </p>
          <p style="margin: 0 0 20px">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next={{ .RedirectTo }}"
              style="
                display: inline-block;
                background: #3f51d6;
                color: #ffffff;
                text-decoration: none;
                padding: 10px 16px;
                border-radius: 8px;
                font-weight: 600;
              "
              >Confirm email</a
            >
          </p>
          <p style="margin: 0; color: #5c6170; font-size: 13px; line-height: 1.5">
            This link expires in one hour and works once. If you didn't request it, you can ignore
            this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
