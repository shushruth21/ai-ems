name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Staging needs a real Postgres/Supabase project (STAGING_ENABLED=true as a
  # repo/environment variable, plus the "staging" environment's DIRECT_URL
  # secret). Until then this skips cleanly instead of failing on a database
  # that doesn't exist yet.
  migrate:
    needs: ci
    if: vars.STAGING_ENABLED == 'true'
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: staging
    secrets: inherit

  deploy:
    needs: migrate
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm add -g vercel@latest
      - run: vercel pull --yes --environment=preview --git-branch=main --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.NEXT_PUBLIC_APP_URL }}/api/health?deep=1"
