name: Bug report
description: Something isn't working
labels: ["type: bug", "triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the page, what you did, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [local, preview, staging, production]
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Error reference
      description: The "Reference" code shown on the error page, if any.
  - type: markdown
    attributes:
      value: "⚠️ Do not paste secrets or customer personal data. Report vulnerabilities privately — see SECURITY.md."
