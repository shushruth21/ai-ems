name: Feature request
description: Propose an improvement
labels: ["type: feature", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        [
          Platform,
          CRM,
          Catalog,
          Sales,
          Inventory,
          Procurement,
          Production,
          Quality,
          Fulfillment,
          Finance,
          People,
          Service,
          Partners,
          Marketing,
          Analytics,
          AI Copilot,
          Other,
        ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "Given … when … then …"
